name: Ask Magic Mike Release Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr324_diagnostic:
        description: "Isolated PR324 Linux diagnosis ONLY; not a release gate"
        type: boolean
        default: false
      pr324_frozen:
        description: "One frozen reconstructed baseline: control plus runtime logpoints; NOT release acceptance"
        type: boolean
        default: false
      pr324_collector_selftest:
        description: "Linux collector fault/retention gate ONLY; no app build or acceptance"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: amm-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-release-gate:
    if: github.event_name != 'workflow_dispatch' || (inputs.pr324_diagnostic != true && inputs.pr324_frozen != true && inputs.pr324_collector_selftest != true)
    name: local-release-gate
    runs-on: ubuntu-latest
    # Public standard runner; retain every test-level bound and mandatory stage.
    # Observed apt font downloads consumed 6–8 minutes of the previous budget.
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Release doctor
        run: pnpm run release:doctor

      - name: Validate immutable release intent
        if: github.event_name == 'pull_request'
        run: pnpm run release:intent:validate

      - name: Release safety scan
        run: pnpm run release:safety

      - name: WordPress Connector PHP syntax lint
        run: |
          php -l wordpress/ask-magic-mike-connector/ask-magic-mike-connector.php
          php tests/wordpress/connector-url-runtime.php

      - name: Unit tests
        run: pnpm run test

      - name: Pinned native contracts, protected guest transport and no-key runtime
        run: |
          pnpm --dir clients/native install --frozen-lockfile --ignore-scripts
          pnpm --dir clients/native run typecheck
          node --test clients/native/candidate.test.cjs clients/native/runtime.test.cjs clients/native/build.test.cjs

      - name: Isolated PostgreSQL QA audit atomicity and replay
        run: AMM_QA_POSTGRES_TEST=1 pnpm exec vitest run tests/persistence/automatic-qa-audit-evidence.test.ts tests/persistence/qa-audit-harness-postgres.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Isolated PostgreSQL notification reliability and recovery
        run: pnpm run test:postgres:notification-reliability

      - name: Isolated PostgreSQL actual Home Value root POST and intake fidelity
        run: AMM_QA_POSTGRES_TEST=1 pnpm exec vitest run tests/persistence/home-value-intake-fidelity-postgres.test.ts tests/persistence/address-capture-postgres.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Isolated PostgreSQL launch inquiry snapshots, per-recipient claims and signed callback recovery
        run: AMM_QA_POSTGRES_TEST=1 pnpm exec vitest run tests/persistence/launch-inquiry-postgres.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Isolated conversation preferences, terminal history, atomic intents and receipt fencing
        run: |
          AMM_QA_POSTGRES_TEST=1 pnpm exec vitest run tests/persistence/public-conversation-postgres.test.ts tests/persistence/public-response-role-grants-postgres.test.ts --maxWorkers=1 --no-file-parallelism
          AMM_QA_POSTGRES_TEST=1 AMM_QA_POSTGRES_MAJOR=18 pnpm exec vitest run tests/persistence/public-response-role-grants-postgres.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Ordinary intake and first-live monitor (real isolated PostgreSQL, no sends)
        run: AMM_QA_POSTGRES_TEST=1 pnpm exec vitest run tests/persistence/first-live-intake-postgres.test.ts tests/persistence/today-ownership-postgres.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Isolated PostgreSQL reference allocation and no-send claims
        run: AMM_QA_POSTGRES_TEST=1 pnpm exec vitest run tests/persistence/reference-allocation-postgres.test.ts

      - name: Isolated PostgreSQL scheduler lease, bounded processor and synthetic restore
        run: AMM_QA_POSTGRES_TEST=1 pnpm exec vitest run tests/persistence/allocation-scheduler-postgres.test.ts

      - name: Isolated staff-only pilot scopes, replies and canonical budget fences
        run: AMM_QA_POSTGRES_TEST=1 pnpm exec vitest run tests/persistence/staff-allocation-pilot-postgres.test.ts

      - name: Isolated PostgreSQL conversion atomicity and complete reporting
        run: AMM_QA_POSTGRES_TEST=1 pnpm exec vitest run tests/persistence/conversion-transaction-postgres.test.ts tests/persistence/conversion-reporting-postgres.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Isolated request-contact evidence, fresh restrictions and evaluation-only audit
        run: AMM_QA_POSTGRES_TEST=1 pnpm exec vitest run tests/persistence/manual-contact-readiness-postgres.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Exact acquisition totals, canonical contacts and operator evidence above old reporting cap
        run: AMM_QA_POSTGRES_TEST=1 pnpm exec vitest run tests/persistence/acquisition-report-postgres.test.ts tests/persistence/acquisition-sources-postgres.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Isolated consumer identity, subject RLS, atomic account recovery and no intake effects
        run: AMM_QA_POSTGRES_TEST=1 pnpm exec vitest run tests/persistence/consumer-workspace-postgres.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Isolated bounded intelligence roles, leases, review-only effects and evaluation budgets (no provider)
        run: AMM_QA_POSTGRES_TEST=1 pnpm exec vitest run tests/persistence/bounded-intelligence-postgres.test.ts tests/persistence/evaluation-checkpoint-postgres.test.ts tests/persistence/operator-handoff-postgres.test.ts tests/persistence/source-lifecycle-postgres.test.ts tests/persistence/intelligence-feedback-postgres.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Isolated traffic identity, seller request and operator digest claims (no sends)
        run: AMM_QA_POSTGRES_TEST=1 pnpm exec vitest run tests/persistence/qualified-conversion-postgres.test.ts tests/persistence/operational-report-grants-postgres.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Install Chromium for isolated real-session acceptance
        run: pnpm exec playwright install --with-deps chromium

      - name: Built public enlarged-text reflow acceptance (no writes)
        run: AMM_E2E_BUILT=1 pnpm exec playwright test tests/e2e/public-text-reflow.spec.ts --workers 1 --reporter=line

      - name: Built direct Call and Text mobile acceptance (local intercepted UI, no sends)
        run: AMM_PUBLIC_CONTACT_ACCEPTANCE=1 AMM_E2E_BUILT=1 AMM_E2E_OUTPUT_DIR=output/playwright/public-contact-mobile pnpm exec playwright test tests/e2e/public-contact-mobile.spec.ts --workers 1 --reporter=line

      - name: Built mobile conversation preferences and same-request recovery (intercepted UI, no sends)
        run: AMM_MOBILE_CONVERSATION_UI=1 AMM_E2E_BUILT=1 AMM_E2E_OUTPUT_DIR=output/playwright/mobile-conversation pnpm exec playwright test tests/e2e/mobile-conversation.spec.ts --workers 1 --reporter=line

      - name: Built cash-review and optional buyer address (local intercepted UI, no sends)
        run: AMM_QUALIFIED_CONVERSION_ACCEPTANCE=1 AMM_E2E_BUILT=1 pnpm exec playwright test tests/e2e/qualified-conversion.spec.ts --workers 1 --reporter=line

      - name: Built cited-guidance projection and native Origin refusal (disconnected no-send)
        run: AMM_PUBLIC_CONCIERGE_ACCEPTANCE=1 AMM_E2E_BUILT=1 DATABASE_ENV=preview PREVIEW_DATA_MODE=disabled pnpm exec playwright test tests/e2e/public-concierge.spec.ts --workers 1 --reporter=line

      - name: Built application real-session and signed HTTP-to-SQL acceptance
        run: pnpm run test:reference:sessions

      - name: Built application conversion journey and responsive acceptance
        run: AMM_CONVERSION_SESSION_ACCEPTANCE=1 pnpm run test:reference:sessions

      - name: Built acquisition report with genuine isolated sessions and no sends
        run: AMM_ACQUISITION_ACCEPTANCE=1 AMM_SESSION_ARTIFACT_DIR=.amm-run/acquisition-ci pnpm run test:reference:sessions

      - name: Built guest workspace and loopback Origin refusal (isolated SQL, no sends)
        run: AMM_CONSUMER_WORKSPACE_ACCEPTANCE=1 AMM_SESSION_ARTIFACT_DIR=.amm-run/consumer-workspace-ci pnpm run test:reference:sessions

      - name: Built consumer account real-session isolation, explicit saves and no sends
        run: AMM_CONSUMER_ACCOUNT_ACCEPTANCE=1 AMM_SESSION_ARTIFACT_DIR=.amm-run/consumer-account-ci pnpm run test:reference:sessions

      - name: Built lead navigation and optional-tool acceptance (isolated, no sends)
        run: AMM_LEAD_READABILITY_ACCEPTANCE=1 AMM_SESSION_ARTIFACT_DIR=.amm-run/lead-navigation-ci pnpm run test:reference:sessions

      - name: Built factual qualification and read-only routing readiness (real sessions, isolated SQL, no sends)
        run: AMM_NC_ROUTING_ACCEPTANCE=1 AMM_SESSION_ARTIFACT_DIR=.amm-run/nc-routing-ci pnpm run test:reference:sessions

      - name: Built staff handoff review with real sessions and current scoped context (isolated, no sends)
        run: AMM_CONCIERGE_HANDOFF_ACCEPTANCE=1 AMM_SESSION_ARTIFACT_DIR=.amm-run/operator-handoff-built-ci pnpm run test:reference:sessions

      - name: Built R2 source lifecycle, scoped answer, feedback and immutable handoff (real sessions and isolated SQL, no sends)
        run: AMM_R2_LIFECYCLE_ACCEPTANCE=1 AMM_SESSION_ARTIFACT_DIR=.amm-run/r2-lifecycle-ci pnpm run test:reference:sessions

      - name: Built native guest CSRF, current source, revocation and exact feedback (isolated SQL, no sends)
        run: AMM_R3_NATIVE_ACCEPTANCE=1 AMM_SESSION_ARTIFACT_DIR=.amm-run/r3-native-api-ci pnpm run test:reference:sessions

      - name: Built Home Value UI failure and replay acceptance (intercepted synthetic receipts, no intake writes)
        run: AMM_SESSION_ARTIFACT_DIR=.amm-run/home-value-intake-ci pnpm run test:home-value:sessions

      - name: Built seller and structured buyer intake UI (isolated harness, intercepted receipts, no sends)
        run: AMM_LAUNCH_INTAKE_UI_ACCEPTANCE=1 AMM_SESSION_ARTIFACT_DIR=.amm-run/launch-intake-ci pnpm run test:reference:sessions

      - name: Built acquisition entry, seller and buyer canonical capture (real isolated SQL, v6 intents only)
        run: AMM_WEB_ACQUISITION_ACCEPTANCE=1 AMM_SESSION_ARTIFACT_DIR=.amm-run/web-acquisition-ci pnpm run test:reference:sessions

      - name: Assert canonical route manifest and cron targets
        run: pnpm run routes:assert

      - name: Release candidate report
        run: pnpm run release:report

      - name: Launch authority report
        run: pnpm run launch:authority

      # next dev replaces .next; keep this diagnostic after every consumer of
      # the production build, including the route-manifest assertion.
      - name: Development guest canonical intake diagnostic (real isolated SQL, no sends)
        run: AMM_E2E_BUILT=0 AMM_CONSUMER_WORKSPACE_ACCEPTANCE=1 AMM_SESSION_ARTIFACT_DIR=.amm-run/consumer-workspace-intake-ci pnpm run test:reference:sessions

      - name: Intentional reviewed concierge handoff (real isolated SQL, development Origin, no sends)
        run: AMM_CONCIERGE_HANDOFF_ACCEPTANCE=1 AMM_E2E_BUILT=0 AMM_SESSION_ARTIFACT_DIR=.amm-run/concierge-handoff-ci pnpm run test:reference:sessions

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-artifacts
          path: |
            artifacts/*.json
            artifacts/*.md
            output/playwright/public-contact-mobile/*.png
            output/playwright/mobile-conversation/*.png
            .amm-run/reference-session-acceptance/receipt.json
            .amm-run/reference-session-acceptance/conversion-receipt.json
            .amm-run/reference-session-acceptance/performance.json
            .amm-run/lead-navigation-ci/receipt.json
            .amm-run/lead-navigation-ci/screenshots/*.png
            .amm-run/nc-routing-ci/receipt.json
            .amm-run/nc-routing-ci/database-identity.json
            .amm-run/nc-routing-ci/screenshots/*.png
            .amm-run/acquisition-ci/receipt.json
            .amm-run/acquisition-ci/screenshots/*.png
            .amm-run/consumer-workspace-ci/receipt.json
            .amm-run/consumer-workspace-ci/screenshots/*.png
            .amm-run/consumer-workspace-ci/screenshots/*.capture.json
            .amm-run/consumer-account-ci/receipt.json
            .amm-run/consumer-account-ci/screenshots/*.png
            .amm-run/r2-lifecycle-ci/receipt.json
            .amm-run/r3-native-api-ci/receipt.json
            .amm-run/r2-lifecycle-ci/screenshots/*.png
            .amm-run/consumer-workspace-intake-ci/receipt.json
            .amm-run/consumer-workspace-intake-ci/screenshots/*.capture.json
            .amm-run/acquisition-report/scale-*.json
            .amm-run/home-value-intake-ci/home-value-ui-receipt.json
            .amm-run/home-value-intake-ci/screenshots/*.png
            .amm-run/home-value-intake-ci/screenshots/*-diagnostics.json
            .amm-run/launch-intake-ci/launch-intake-ui-receipt.json
            .amm-run/web-acquisition-ci/receipt.json
            .amm-run/web-acquisition-ci/screenshots/*.png
            .amm-run/launch-intake-ci/screenshots/*.png
            .amm-run/launch-intake-ci/screenshots/*-diagnostics.json
          if-no-files-found: ignore

      - name: Summarize failed release gate
        if: failure()
        env:
          CI_FAILURE_ROOT_CAUSE_CATEGORY: SOURCE_OR_BUILD_VALIDATION
          CI_FAILURE_FAILED_COMPONENT: local-release-gate
          CI_FAILURE_EXPECTED: All mandatory release checks complete successfully
          CI_FAILURE_ACTUAL: One or more mandatory release checks failed; inspect the first failed step and uploaded artifacts
          CI_FAILURE_REMEDIATION: Repair the first failing deterministic check, rerun locally with Node 24, and push one reviewed fix
          CI_FAILURE_RETRY_SAFE: "true"
          CI_FAILURE_PRODUCTION_IMPACT: No production mutation occurred; the candidate is blocked from release
        run: node scripts/write-ci-failure-summary.mjs

  pr324-stale-review-diagnostic:
    name: PR324 passive Linux diagnosis - NOT release acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.pr324_diagnostic == true && inputs.pr324_collector_selftest != true && github.ref == 'refs/heads/codex/pr324-linux-stale-review-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version-pinned passive Next decoder and router observers - diagnosis only
        env:
          AMM_STALE_REVIEW_DIAGNOSTIC: '1'
        run: node scripts/amm/pr324-next-diagnostic.mjs
      - name: Build sealed diagnostic source - not release acceptance
        run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Original serial suite and passive same-record boundary capture
        env:
          AMM_QA_POSTGRES_TEST: '1'
          AMM_STALE_REVIEW_DIAGNOSTIC: '1'
          AMM_SESSION_ARTIFACT_DIR: .amm-run/pr324-linux-diagnostic
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/amm/reference-session-acceptance.mjs
      - name: Failure-safe sanitized evidence only - no traces or storage state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr324-linux-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            .amm-run/pr324-linux-diagnostic/stale-review-*.json
            .amm-run/pr324-linux-diagnostic/stale-review-*.jsonl
            .amm-run/pr324-linux-diagnostic/stale-review-*.png
            .amm-run/pr324-linux-diagnostic/receipt.json
          if-no-files-found: warn

  pr324-frozen-boundary:
    name: PR324 frozen bundle control and logpoints - NOT release acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.pr324_frozen == true && inputs.pr324_diagnostic != true && inputs.pr324_collector_selftest != true && github.ref == 'refs/heads/codex/pr324-linux-stale-review-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: a5021cc6dc66ab26420d1127554e66c022a08670
          path: frozen-baseline
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install exact baseline dependencies - no framework observers
        working-directory: frozen-baseline
        run: pnpm install --frozen-lockfile
      - name: Reconstruct a502 once - not the retained original artifact
        working-directory: frozen-baseline
        run: pnpm run build
      - working-directory: frozen-baseline
        run: pnpm exec playwright install --with-deps chromium
      - name: Same emitted bytes, fresh fixtures, one control and one logpoint replay
        run: node scripts/amm/pr324-frozen-bundle.mjs frozen-baseline
      - name: Sanitized frozen evidence only - no trace, session or raw payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr324-frozen-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          # Only these explicit sanitized files; never upload hidden directories broadly.
          include-hidden-files: true
          path: |
            frozen-baseline/.amm-run/frozen-*/stale-review-*.json
            frozen-baseline/.amm-run/frozen-*/stale-review-*.jsonl
            frozen-baseline/.amm-run/frozen-*/stale-review-*.png
            frozen-baseline/.amm-run/frozen-*/frozen-*.json
            frozen-baseline/.amm-run/frozen-*/receipt.json
          if-no-files-found: error

  pr324-collector-selftest:
    name: PR324 collector Linux fault and retention gate - NOT app acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.pr324_collector_selftest == true && inputs.pr324_frozen != true && inputs.pr324_diagnostic != true && github.ref == 'refs/heads/codex/pr324-linux-stale-review-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Existing collector regressions
        run: node --test scripts/amm/pr324-frozen-logpoints.test.mjs
      - name: Real synthetic browser and CPU-worker fault tests - no application
        env:
          AMM_COLLECTOR_SELFTEST: '1'
        run: node scripts/amm/pr324-collector-selftest.mjs
      - name: Exact required inventory, attempt, schemas and checksums
        if: always()
        run: node scripts/amm/pr324-collector-package.mjs output/pr324-collector
      - name: Required sanitized collector evidence - no hidden tree or traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr324-collector-selftest-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            output/pr324-collector/collector-case-normal.json
            output/pr324-collector/collector-case-assertion.json
            output/pr324-collector/collector-case-target-closed.json
            output/pr324-collector/collector-case-stalled-capture.json
            output/pr324-collector/collector-case-stalled-mapping.json
            output/pr324-collector/collector-selftest.json
            output/pr324-collector/collector-package.json
